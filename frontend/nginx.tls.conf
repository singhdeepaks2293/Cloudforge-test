# CloudForge frontend — TLS server block (Phase 7, risk R12).
#
# Included only via the TLS compose override
# (deployments/compose/docker-compose.tls.yml), which mounts this
# file OVER /etc/nginx/conf.d/default.conf (replacing the base
# nginx.conf) and the certificate/key at /etc/nginx/tls/.
# :8443 terminates TLS with the same proxy locations as the base
# config, plus HSTS; plain HTTP :8080 redirects to https://$host
# (port 443 on the host — see the override file for why the HTTPS
# port must stay 443 while HSTS is on).
#
# UNVERIFIED in this sandbox (no Docker/nginx): reviewed, not run
# (`nginx -t` needs a real host). The certificate is self-signed
# by scripts/gen-tls-cert.sh — browsers will warn until it is
# trusted or replaced with a CA certificate.

# Plain HTTP redirects to HTTPS (host port 443, the default).
server {
    listen       8080;
    server_name  _;
    return 301 https://$host$request_uri;
}

server {
    listen       8443 ssl;
    server_name  _;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # HSTS: only ever sent over HTTPS (this block is HTTPS-only).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    root   /usr/share/nginx/html;
    index  index.html;

    resolver 127.0.0.11 valid=30s;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~ ^/api/v1/labs/[^/]+/terminal$ {
        set $api_upstream api:8080;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        set $api_upstream api:8080;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /healthz {
        set $api_upstream api:8080;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
    }

    location = /readyz {
        set $api_upstream api:8080;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
    }

    # Phase 7 (R5): /metrics is not proxied, same as the HTTP block.
    location = /metrics {
        return 404;
    }
}
