server {
    # M9 Part 3: nginx runs as the unprivileged `nginx` user (see
    # Dockerfile), so it cannot bind :80 — it listens on 8080 and
    # compose maps that to :8080 on the host.
    listen       8080;
    server_name  _;

    # Phase 7 (R6/R12): security headers on every response the
    # frontend serves or proxies. The API adds the same headers
    # itself (backend/internal/httpapi/security_p7.go); nginx adds
    # them here so static assets and proxied responses are covered
    # even if the API is bypassed. HSTS is intentionally NOT set
    # here: this server is plain HTTP; the TLS override
    # (deployments/compose/docker-compose.tls.yml) sets HSTS on its
    # own 443 server block.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    root   /usr/share/nginx/html;
    index  index.html;

    resolver 127.0.0.11 valid=30s;

    # Single-page app: every unknown path serves index.html so
    # react-router-dom routes (/courses, /labs, ...) resolve client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets are content-hashed by Vite; safe to cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Lab terminal WebSocket (a regex location beats the plain /api/
    # prefix location for matching paths).
    location ~ ^/api/v1/labs/[^/]+/terminal$ {
        set $api_upstream api:8080;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Terminal sessions are long-lived.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Go API (REST).
    location /api/ {
        set $api_upstream api:8080;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Liveness / readiness — same upstream, exact matches.
    location = /healthz {
        set $api_upstream api:8080;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
    }

    location = /readyz {
        set $api_upstream api:8080;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
    }

    # Phase 7 (R5): /metrics is NOT proxied any more. It requires
    # the X-Metrics-Token header and is scraped by Prometheus
    # directly on the internal network (api:8080). Returning 404
    # here keeps the endpoint undiscoverable through the frontend.
    location = /metrics {
        return 404;
    }
}
