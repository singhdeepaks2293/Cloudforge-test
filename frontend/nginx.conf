# CloudForge frontend — nginx (Milestone 9: same-origin reverse proxy).
#
# The browser talks to this container only. /api, /healthz, /readyz
# and /metrics are proxied to the Go API service (`api:8080`), so no
# CORS configuration is needed and VITE_API_URL can stay unset
# (same-origin). The lab terminal WebSocket
# (/api/v1/labs/{id}/terminal) gets its own location with the Upgrade
# headers; the regex location wins over the /api/ prefix because
# nginx evaluates regex locations after prefix matches.
#
# Upstream resolution: `api` is a Docker service name. It is resolved
# per request through Docker's embedded DNS (127.0.0.11) via a
# variable, so recreating the api container (new IP) does not require
# an nginx restart. `frontend` depends on `api` being healthy in
# compose, so the name exists at startup.
#
# M9 Part 3: the pid file lives in /tmp because nginx runs as the
# unprivileged `nginx` user and /var/run is not writable by it.

server {
    # M9 Part 3: nginx runs as the unprivileged `nginx` user (see
    # Dockerfile), so it cannot bind :80 — it listens on 8080 and
    # compose maps that to :80 on the host.
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    resolver 127.0.0.11 valid=30s;

    # Single-page app: every unknown path serves index.html so
    # react-router-dom routes (/courses, /labs, ...) resolve client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets are content-hashed by Vite; safe to cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Lab terminal WebSocket (a regex location beats the plain /api/
    # prefix location for matching paths).
    location ~ ^/api/v1/labs/[^/]+/terminal$ {
        set $api_upstream api:8080;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Terminal sessions are long-lived.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Go API (REST).
    location /api/ {
        set $api_upstream api:8080;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Liveness / readiness / metrics — same upstream, exact matches.
    location = /healthz {
        set $api_upstream api:8080;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
    }

    location = /readyz {
        set $api_upstream api:8080;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
    }

    location = /metrics {
        set $api_upstream api:8080;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
    }
}
