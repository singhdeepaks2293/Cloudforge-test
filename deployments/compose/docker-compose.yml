# CloudForge — compose deployment (Milestone 1, hardened M9 Part 3)
#
# Pinned images only; no :latest anywhere.
# NOTE: the `api` build context is backend/ (backend/Dockerfile,
# M9 Part 3) and the `network-engine` build context is the repo root
# (rust-network-engine/Dockerfile copies rust-network-engine/ and
# proto/ relative to the repo root — a context of
# rust-network-engine/ alone would fail its COPY steps).
#
# Privilege policy: ONLY network-engine carries a capability
# (NET_ADMIN, required in M4 for netlink/nftables work). api, frontend,
# postgres and redis run with no added capabilities. network-engine must
# run on the KVM host machine, not inside this sandbox — see
# infrastructure/scripts/check-host.sh.
#
# Networks:
#   frontend_net   - browser-facing: frontend + api
#   backend_net    - internal: api, worker (M2), postgres, redis
#   emulator_net   - internal: api + AWS emulator / MinIO (M5)
#   management_net - internal: host agent + network engine control traffic

services:
  api:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    image: cloudforge-api:0.1.0
    container_name: cloudforge-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-cloudforge}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-cloudforge}?sslmode=disable
      # M9: config reads REDIS_ADDR (not REDIS_URL) and
      # CLOUDFORGE_JWT_SECRET (not JWT_SECRET). The old names
      # silently fell back to localhost:6379 / the dev default
      # secret; with fail-closed auth rate limiting, a wrong
      # REDIS_ADDR would 503 every login in Docker.
      REDIS_ADDR: redis:6379
      NETWORK_ENGINE_ADDR: network-engine:50051
      CLOUDFORGE_JWT_SECRET: ${CLOUDFORGE_JWT_SECRET:?set CLOUDFORGE_JWT_SECRET in .env}
      # Phase 7: engine auth token (shared with network-engine)
      # and the /metrics scrape token (shared with Prometheus).
      # Both are fail-closed: compose refuses to start without
      # them unless CLOUDFORGE_DEV=1 is set in .env.
      CLOUDFORGE_ENGINE_TOKEN: ${CLOUDFORGE_ENGINE_TOKEN:?set CLOUDFORGE_ENGINE_TOKEN in .env}
      # Phase 7 fail-closed: the API/worker refuse to start while
      # MINIO_ACCESS_KEY/SECRET_KEY are still the minioadmin defaults.
      # Compose never passed them before, so .env's MINIO_ROOT_* values
      # never reached the API — wire them through here. In lite mode
      # MinIO does not run, but the check still runs, so the values
      # must be non-default regardless.
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-cloudforge}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      CLOUDFORGE_METRICS_TOKEN: ${CLOUDFORGE_METRICS_TOKEN:?set CLOUDFORGE_METRICS_TOKEN in .env}
      CLOUDFORGE_DEV: ${CLOUDFORGE_DEV:-0}
      # The API still listens on 8080 INSIDE its container (the host
      # port is API_PORT in .env, default 8081 — see ports below);
      # pin it explicitly because config's dev default is now :8081.
      CLOUDFORGE_ADDR: ":8080"
      # Curriculum (M8): the API seeds tracks/lessons/achievements
      # from curriculum/ at startup. The api build context is
      # backend/ only, so the repo-root curriculum/ is NOT in the
      # image — it is mounted read-only below (a volume mount, not
      # a build-context change, so backend/Dockerfile is untouched).
      # CURRICULUM_DIR is set explicitly: with it set, a missing
      # mount fails startup loudly instead of silently running
      # with no curriculum ("seeding skipped" warning). Relative
      # bind paths resolve against this compose file's directory,
      # so ../../curriculum is the repo-root curriculum/ from any
      # working directory.
      CURRICULUM_DIR: /curriculum
      # Phase 4: when set, the ECR registry backend proxies to the
      # local registry:2 container below instead of the local-disk
      # backend. Empty (or unset) in lite/dev = local-disk backend.
      ECR_REGISTRY_URL: http://registry:5000
      # Phase 4: CodeBuild/CodePipeline sources must be absolute
      # paths under this root. In the full compose stack the workdir
      # root is the labs volume; the API defaults to it when unset.
      CLOUDFORGE_BUILD_SOURCE_ROOT: /var/lib/cloudforge/labs
    ports:
      - "${API_PORT:-8081}:8080"
    volumes:
      - ../../curriculum:/curriculum:ro
    networks:
      - frontend_net
      - backend_net
      - emulator_net
      - management_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # The distroless api image has no wget/curl; it probes itself
      # with the api binary's --health-check flag (GET /readyz).
      # M9: /readyz (503 while Postgres is down; Redis/engine outages
      # are reported but do not fail readiness).
      test: ["CMD", "/app/api", "--health-check"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  # Phase 1: the full compose file runs a worker, mirroring lite.
  # Lab provisioning/destroy/expiry are worker jobs; without a worker
  # a full-mode lab would sit in CREATED forever (the API returns 202
  # and enqueues the job). The worker listens on :8083 internally
  # (the API host port moved to 8081, so the old worker default :8081
  # would collide).
  worker:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    image: cloudforge-api:0.1.0
    container_name: cloudforge-worker
    restart: unless-stopped
    # ENTRYPOINT in backend/Dockerfile is ["/app/api"], so a plain
    # command: ["/app/worker"] runs "/app/api /app/worker" — a second
    # API server, not the worker. No worker ever ran, so lab jobs
    # (provision/destroy/expire) sat pending forever and labs stuck
    # in DESTROYING. Override the entrypoint instead.
    entrypoint: ["/app/worker"]
    # The image healthcheck probes the API (/readyz on :8081); the
    # worker listens on :8083 with /healthz, so disable it here.
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-cloudforge}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-cloudforge}?sslmode=disable
      REDIS_ADDR: redis:6379
      NETWORK_ENGINE_ADDR: network-engine:50051
      CLOUDFORGE_JWT_SECRET: ${CLOUDFORGE_JWT_SECRET:?set CLOUDFORGE_JWT_SECRET in .env}
      CLOUDFORGE_ENGINE_TOKEN: ${CLOUDFORGE_ENGINE_TOKEN:?set CLOUDFORGE_ENGINE_TOKEN in .env}
      # Phase 7 fail-closed: the API/worker refuse to start while
      # MINIO_ACCESS_KEY/SECRET_KEY are still the minioadmin defaults.
      # Compose never passed them before, so .env's MINIO_ROOT_* values
      # never reached the API — wire them through here. In lite mode
      # MinIO does not run, but the check still runs, so the values
      # must be non-default regardless.
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-cloudforge}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      CLOUDFORGE_DEV: ${CLOUDFORGE_DEV:-0}
      # Worker listens on :8083 internally (see the port table in
      # docs/IMPLEMENTATION_STATUS.md §1).
      WORKER_ADDR: ":8083"
      CURRICULUM_DIR: /curriculum
    volumes:
      - ../../curriculum:/curriculum:ro
    networks:
      - backend_net
      - management_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.50"


  network-engine:
    build:
      # Repo-root context: the engine Dockerfile copies
      # rust-network-engine/ and proto/ relative to the repo root.
      context: ../..
      dockerfile: rust-network-engine/Dockerfile
    image: cloudforge-network-engine:0.1.0
    container_name: cloudforge-network-engine
    restart: unless-stopped
    # Minimum capability for netlink / nftables work (M4). No other
    # capabilities, no --privileged. Runs on the KVM host only.
    cap_add:
      - NET_ADMIN
    environment:
      NETWORK_ENGINE_ADDR: "0.0.0.0:50051"
      # Phase 7 (R1): the engine requires this token on every gRPC
      # RPC. The port is NOT published on the host any more: only
      # the api/worker reach the engine, on management_net.
      CLOUDFORGE_ENGINE_TOKEN: ${CLOUDFORGE_ENGINE_TOKEN:?set CLOUDFORGE_ENGINE_TOKEN in .env}
    networks:
      - management_net
    healthcheck:
      # The engine binary has no --health-check flag (it ignores
      # argv and would try to start a second server), so the old
      # `network-engine --health-check` probe could never pass.
      # This is a TCP liveness probe only: it proves the gRPC
      # listener is up, not that the engine is healthy. Real engine
      # health is reported by the API's /readyz (network_engine_*).
      test: ["CMD-SHELL", "timeout 3 bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/50051'"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.50"


  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        # M9: empty by default — the browser uses same-origin
        # relative URLs through the nginx proxy (frontend/nginx.conf).
        # Set VITE_API_URL only for a split deployment where the API
        # lives on another origin.
        VITE_API_URL: ${VITE_API_URL:-}
    image: cloudforge-frontend:0.1.0
    container_name: cloudforge-frontend
    restart: unless-stopped
    # M9 Part 3: nginx runs unprivileged and listens on 8080 inside
    # the container (see frontend/Dockerfile); the host port is :8080.
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    networks:
      - frontend_net
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.50"


  postgres:
    image: postgres:16.4
    container_name: cloudforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cloudforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-cloudforge}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cloudforge} -d ${POSTGRES_DB:-cloudforge}"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"


  redis:
    image: redis:7.4
    container_name: cloudforge-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    networks:
      - backend_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 5

  # Optional: local Docker registry (registry:2) for the Phase 4
  # ECR backend. Start with: docker compose --profile optional up -d registry
  # The api then proxies ECR push/pull to it (ECR_REGISTRY_URL above);
  # without this profile the api uses the local-disk backend instead.
  # The registry has NO auth (local-only — the engine gRPC it
  # resembles is now token-authenticated, Phase 7) and is not
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.50"

  # exposed on a host port:
  # only the api reaches it, on emulator_net. UNVERIFIED in the
  # sandbox (no Docker here) — first verified run must be on a real
  # Docker host; see docs/IMPLEMENTATION_STATUS.md §13.
  registry:
    profiles: ["optional"]
    image: registry:2.8.3
    container_name: cloudforge-registry
    restart: unless-stopped
    environment:
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /var/lib/registry
    volumes:
      - registrydata:/var/lib/registry
    networks:
      - emulator_net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:5000/v2/"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5

  # Optional: S3-compatible object storage for the M5 S3 adapter.
  # Start with: docker compose --profile optional up -d minio
  minio:
    profiles: ["optional"]
    image: minio/minio:RELEASE.2024-08-17T01-12-02Z
    container_name: cloudforge-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cloudforge}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env to enable minio}
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - miniodata:/data
    networks:
      - emulator_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5

  # Optional: Prometheus + Grafana (Milestone 9, Part 3).
  # Start with: docker compose --profile monitoring up -d
  # Prometheus scrapes the API's /metrics (see
  # infrastructure/monitoring/prometheus.yml); Grafana serves the
  # CloudForge dashboards from infrastructure/monitoring/ on
  # :3000. Both images are pinned; the tags were verified to exist
  # on Docker Hub 2026-11-21. Grafana's first login is admin/admin
  # and forces a password change unless GRAFANA_ADMIN_PASSWORD is
  # set in .env — set it before any shared deployment.
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.3.0
    container_name: cloudforge-prometheus
    restart: unless-stopped
    environment:
      # Phase 7 (R5): Prometheus scrapes /metrics with this token
      # (prometheus.yml substitutes it into the scrape config).
      CLOUDFORGE_METRICS_TOKEN: ${CLOUDFORGE_METRICS_TOKEN:?set CLOUDFORGE_METRICS_TOKEN in .env}
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ../../infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - frontend_net
    depends_on:
      api:
        condition: service_healthy

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:11.5.2
    container_name: cloudforge-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # Phase 7 (R4): no more admin/admin default — compose
      # refuses to start the monitoring profile without this.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../../infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../infrastructure/monitoring:/etc/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    networks:
      - frontend_net
    depends_on:
      - prometheus

networks:
  frontend_net:
    name: cloudforge_frontend_net
  backend_net:
    name: cloudforge_backend_net
    internal: true
  emulator_net:
    name: cloudforge_emulator_net
    internal: true
  management_net:
    name: cloudforge_management_net
    internal: true

volumes:
  pgdata:
    name: cloudforge_pgdata
  redisdata:
    name: cloudforge_redisdata
  miniodata:
    name: cloudforge_miniodata
  registrydata:
    name: cloudforge_registrydata
  prometheusdata:
    name: cloudforge_prometheusdata
  grafanadata:
    name: cloudforge_grafanadata
  # Reserved for M3 (host agent / libvirt): VM disks, templates, lab artifacts.
  vm-disks:
    name: cloudforge_vm_disks
  templates:
    name: cloudforge_templates
  lab-artifacts:
    name: cloudforge_lab_artifacts
