    type: break_fix_solved
    operator: '>='
    value: 6
  xp: 300
- id: challenge-accepted
  title: Challenge Accepted
  description: Complete your first challenge without guided steps.
  trigger:
    type: challenges_completed
    operator: '>='
    value: 1
