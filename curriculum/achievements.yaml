  title: Cloud Foundations
  description: Complete the Cloud Computing Fundamentals track.
  trigger:
    type: track_completed
    track: fundamentals
  xp: 100
- id: network-builder
  title: Network Builder
  description: Complete the VPC & Networking track.
  trigger:
    type: track_completed
    track: networking
  xp: 150
- id: security-minded
  title: Security Minded
  description: Complete the IAM & Security track.
  trigger:
    type: track_completed
    track: iam
  xp: 150
- id: breaker
  title: Breaker
  description: Solve your first break-and-fix scenario.
  trigger:
    type: break_fix_solved
    operator: '>='
    value: 1
  xp: 100
- id: fixer
  title: Fixer
  description: Solve all break-and-fix scenarios.
