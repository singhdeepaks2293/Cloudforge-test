  title: Exam Ace
  description: Score 100% on any track assessment.
  trigger:
    type: assessment_score
    operator: '>='
    value: 100
  xp: 100
- id: xp-1000
  title: Rising Cloud
  description: Earn 1,000 XP in total.
  trigger:
    type: xp_total
    operator: '>='
    value: 1000
  xp: 100
- id: xp-5000
  title: Cloud Architect
  description: Earn 5,000 XP in total.
  trigger:
    type: xp_total
    operator: '>='
    value: 5000
  xp: 250
- id: streak-7
  title: Seven-Day Streak
  description: Learn for seven days in a row.
  trigger:
    type: streak_days
    operator: '>='
    value: 7
  xp: 150
- id: full-stack
  title: Full Stack
  description: Complete every beginner track.
  trigger:
    type: tracks_completed
