[package]
name = "grpc-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "CloudForge Rust network engine: gRPC server (tonic) over the engine-core topology store. Binary name: network-engine."
default-run = "network-engine"

[[bin]]
name = "network-engine"
path = "src/main.rs"

[dependencies]
engine-core = { workspace = true }
ipam = { workspace = true }
firewall = { workspace = true }
routing = { workspace = true }
fault-injection = { workspace = true }
telemetry = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }
prost = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[build-dependencies]
tonic-build = { workspace = true }
protoc-bin-vendored = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
tonic = { workspace = true }
